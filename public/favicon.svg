<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cyanSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Circular Loop Arcs -->
  <path d="M 256 64 A 192 192 0 0 1 448 256" fill="none" stroke="url(#cyanSweep)" stroke-width="26" stroke-linecap="round" />
  <path d="M 448 256 L 464 230 L 434 236 Z" fill="#67e8f9" />

  <path d="M 256 448 A 192 192 0 0 1 64 256" fill="none" stroke="url(#emeraldSweep)" stroke-width="26" stroke-linecap="round" />
  <path d="M 64 256 L 48 282 L 78 276 Z" fill="#34d399" />

  <!-- 'R' Emblem -->
  <rect x="156" y="128" width="52" height="256" rx="18" fill="url(#rGrad)" />
  <path d="M 190 128 L 286 128 C 342 128, 374 158, 374 206 C 374 254, 342 284, 286 284 L 190 284 Z" fill="url(#rGrad)" />
  <path d="M 208 172 L 282 172 C 310 172, 326 186, 326 206 C 326 226, 310 240, 282 240 L 208 240 Z" fill="#0c5b55" />
  <path d="M 260 262 L 354 372 C 362 381, 376 384, 388 380 C 400 376, 406 362, 396 350 L 310 250 Z" fill="url(#rGrad)" />

  <!-- Gold Sun -->
